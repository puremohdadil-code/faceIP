[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelmesh"
version = "0.1.0"
description = "Authorized defensive network observability platform"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api"]

[tool.setuptools.packages.find]
where = ["apps/api"]
